<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Progress Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #888888;
    --line: #e5e5e5;
    --line-strong: #cccccc;
    --accent: #2563eb;
    --soft: #f7f7f7;
    --danger: #b91c1c;
    --success: #16a34a;

    /* stage accents — used sparingly */
    --c-design: #7c3aed;
    --c-build:  #2563eb;
    --c-ship:   #16a34a;
    --c-market: #d97706;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  h1, h2, h3, h4 {
    font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* ===== Layout ===== */
  .app {
    display: flex;
    max-width: 1000px;
    margin: 0 auto;
    min-height: 100vh;
  }
  .sidebar {
    width: 264px;
    flex: none;
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
  }
  main#detail {
    flex: 1;
    min-width: 0;
    padding: 34px 32px 60px;
  }

  .brand {
    font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* ===== Nav ===== */
  nav { margin-top: 22px; flex: 1; }
  .nav-group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 700;
    font-family: Helvetica, Arial, sans-serif;
    margin: 20px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-group-label:first-child { margin-top: 0; }
  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--fg);
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--soft); }
  .nav-item.active { font-weight: 700; }
  .nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }
  .nav-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav-empty {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    padding: 6px 10px;
  }
  .add-mini {
    background: var(--accent);
    color: #fff;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .add-mini:hover { opacity: 0.9; }

  .sidebar-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .footer-note {
    font-size: 10px;
    color: var(--muted);
    font-family: Helvetica, Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
    margin-top: 4px;
  }

  /* ===== Detail panel ===== */
  .detail-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .detail-title-wrap {
    display: flex;
    gap: 12px;
    align-items: stretch;
    min-width: 0;
  }
  .detail-bar {
    width: 4px;
    border-radius: 2px;
    flex: none;
  }
  .detail-title { margin: 0; font-size: 24px; }
  .detail-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .detail-title-input {
    font-size: 20px;
    font-weight: 700;
    font-family: Helvetica, Arial, sans-serif;
    flex: 1;
    min-width: 200px;
  }

  .header-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .btn {
    background: none;
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    color: var(--fg);
  }
  .btn:hover { background: var(--soft); }
  .btn.full { width: 100%; }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 11px;
    padding: 8px 16px;
  }
  .btn.primary:hover { opacity: 0.9; background: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: #fef2f2; }

  .notes-display {
    white-space: pre-wrap;
    padding: 14px 16px;
    background: var(--soft);
    border-radius: 6px;
    font-size: 14.5px;
    color: #333;
    min-height: 60px;
    word-break: break-word;
  }
  .notes-display.empty {
    color: var(--muted);
    font-style: italic;
  }

  /* Rendered markdown */
  .notes-display.rendered { white-space: normal; }
  .notes-display.rendered h1,
  .notes-display.rendered h2,
  .notes-display.rendered h3,
  .notes-display.rendered h4,
  .notes-display.rendered h5,
  .notes-display.rendered h6 {
    font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 16px 0 8px;
    line-height: 1.25;
    color: var(--fg);
  }
  .notes-display.rendered h1:first-child,
  .notes-display.rendered h2:first-child,
  .notes-display.rendered h3:first-child,
  .notes-display.rendered h4:first-child,
  .notes-display.rendered p:first-child,
  .notes-display.rendered ul:first-child,
  .notes-display.rendered ol:first-child { margin-top: 0; }
  .notes-display.rendered h1 { font-size: 19px; }
  .notes-display.rendered h2 { font-size: 17px; }
  .notes-display.rendered h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .notes-display.rendered h4,
  .notes-display.rendered h5,
  .notes-display.rendered h6 { font-size: 14px; }
  .notes-display.rendered p { margin: 8px 0; }
  .notes-display.rendered strong { font-weight: 700; color: var(--fg); }
  .notes-display.rendered em { font-style: italic; }
  .notes-display.rendered ul,
  .notes-display.rendered ol { margin: 8px 0; padding-left: 22px; }
  .notes-display.rendered li { margin: 3px 0; }
  .notes-display.rendered li > p { margin: 4px 0; }
  .notes-display.rendered a { color: var(--accent); text-decoration: underline; word-break: break-all; }
  .notes-display.rendered code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    background: #eceff3;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .notes-display.rendered pre {
    background: #1e1e1e;
    color: #f5f5f5;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.5;
    margin: 10px 0;
  }
  .notes-display.rendered pre code { background: transparent; color: inherit; padding: 0; font-size: inherit; }
  .notes-display.rendered blockquote {
    border-left: 3px solid var(--line-strong);
    margin: 10px 0;
    padding: 4px 12px;
    color: #555;
    font-style: italic;
  }
  .notes-display.rendered hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .notes-display.rendered table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .notes-display.rendered th,
  .notes-display.rendered td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .notes-display.rendered th { background: var(--soft); font-family: Helvetica, Arial, sans-serif; font-weight: 700; }
  .notes-display.rendered input[type="checkbox"] { margin-right: 6px; }

  .markdown-hint {
    font-size: 11px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-top: 6px;
    line-height: 1.6;
  }
  .markdown-hint code { background: var(--soft); padding: 1px 5px; border-radius: 3px; font-size: 11px; }

  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.55;
    resize: vertical;
    min-height: 240px;
    color: var(--fg);
    background: var(--bg);
    margin-top: 4px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  input[type="text"] {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 15px;
    color: var(--fg);
    background: var(--bg);
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .edit-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 12px;
  }

  /* ===== Modal ===== */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--bg);
    padding: 24px;
    border-radius: 8px;
    max-width: 420px;
    width: 100%;
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .modal-buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  @media (max-width: 760px) {
    .app { flex-direction: column; min-height: 0; }
    .sidebar {
      width: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
      padding: 20px 16px;
    }
    nav { flex: none; }
    main#detail { padding: 24px 18px 50px; }
    .detail-title { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div>
      <div class="brand">App Progress</div>
      <div class="brand-sub">Build &amp; ship tracker</div>
    </div>

    <nav>
      <div class="nav-group-label">The Process</div>
      <ul id="nav-playbooks"></ul>

      <div class="nav-group-label">
        <span>Projects</span>
        <button class="add-mini" id="add-project-btn" title="Add new project">+</button>
      </div>
      <ul id="nav-projects"></ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn full" id="export-btn">Export JSON</button>
      <button class="btn full" id="import-btn">Import JSON</button>
      <input type="file" id="import-file" accept="application/json" style="display:none;">
      <div class="footer-note">Saved in this browser · local only</div>
    </div>
  </aside>

  <main id="detail"></main>
</div>

<div class="modal-bg" id="confirm-modal">
  <div class="modal">
    <h3 id="confirm-title">Are you sure?</h3>
    <div id="confirm-body" style="font-size:14px; color:#444;"></div>
    <div class="modal-buttons">
      <button class="btn" id="confirm-cancel">Cancel</button>
      <button class="btn danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'app-progress-tracker-v1';

const PLAYBOOK_DEFS = [
  { id: 'designing', label: 'Designing an App from Scratch', color: 'var(--c-design)',
    sub: 'Thinking up the idea, picking what to build, sketching it out.',
    placeholder: 'Your process for designing apps. What you do before opening Cursor — picking the idea, validating it, sketching the UI, etc.' },
  { id: 'building', label: 'Building in Cursor', color: 'var(--c-build)',
    sub: 'What to do once you\'re actually building it.',
    placeholder: 'Your process inside Cursor. Setup commands, prompting patterns, debugging steps, what to do when stuck.' },
  { id: 'shipping', label: 'Shipping to the App Store', color: 'var(--c-ship)',
    sub: 'Submission, screenshots, metadata, review.',
    placeholder: 'Your App Store submission checklist. Bundle ID setup, screenshots, metadata, review notes, common rejections to avoid.' },
  { id: 'marketing', label: 'Marketing', color: 'var(--c-market)',
    sub: 'How people hear about it. Channels, audiences, launch.',
    placeholder: 'How you market apps once they ship. Launch channels, posts, communities, what worked, what didn\'t.' }
];

const MD_HINT = '<div class="markdown-hint"><code># Heading</code> · <code>## Subhead</code> · <code>**bold**</code> · <code>*italic*</code> · <code>- list</code> · <code>[link](url)</code> · <code>`code`</code></div>';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    if (!parsed.playbooks) parsed.playbooks = {};
    if (!parsed.projects) parsed.projects = [];
    for (const def of PLAYBOOK_DEFS) {
      if (parsed.playbooks[def.id] === undefined) parsed.playbooks[def.id] = '';
    }
    return parsed;
  } catch (e) {
    return defaultData();
  }
}

function defaultData() {
  const playbooks = {};
  for (const def of PLAYBOOK_DEFS) playbooks[def.id] = '';
  return { playbooks, projects: [] };
}

function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

let data = loadData();
let selected = { type: 'playbook', id: 'designing' };   // what's shown in the detail panel
let editing = false;                                     // is the current item in edit mode
let pendingConfirm = null;

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderMarkdown(str) {
  if (!str) return '';
  try {
    if (window.marked) marked.setOptions({ breaks: true, gfm: true });
    const rawHtml = window.marked ? marked.parse(str) : escapeHtml(str).replace(/\n/g, '<br>');
    if (window.DOMPurify) return DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
    return rawHtml;
  } catch (e) {
    return escapeHtml(str).replace(/\n/g, '<br>');
  }
}

function newId(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}

// ===== Render =====

function render() {
  renderNav();
  renderDetail();
}

function renderNav() {
  // Playbooks
  const pbUl = document.getElementById('nav-playbooks');
  pbUl.innerHTML = PLAYBOOK_DEFS.map(def => {
    const active = selected.type === 'playbook' && selected.id === def.id;
    const style = active ? `style="box-shadow: inset 3px 0 0 ${def.color}; background:#f1f3f7;"` : '';
    return `
      <li class="nav-item ${active ? 'active' : ''}" data-nav-playbook="${def.id}" ${style}>
        <span class="nav-dot" style="background:${def.color}"></span>
        <span class="nav-label">${escapeHtml(def.label)}</span>
      </li>`;
  }).join('');

  // Projects
  const prUl = document.getElementById('nav-projects');
  if (!data.projects.length) {
    prUl.innerHTML = '<li class="nav-empty">No projects yet</li>';
  } else {
    prUl.innerHTML = data.projects.map(p => {
      const active = selected.type === 'project' && selected.id === p.id;
      const title = (p.title && p.title.trim()) ? p.title : 'Untitled Project';
      const style = active ? 'style="box-shadow: inset 3px 0 0 var(--accent); background:#eef2ff;"' : '';
      return `
        <li class="nav-item ${active ? 'active' : ''}" data-nav-project="${p.id}" ${style}>
          <span class="nav-dot" style="background:var(--accent)"></span>
          <span class="nav-label">${escapeHtml(title)}</span>
        </li>`;
    }).join('');
  }

  pbUl.querySelectorAll('[data-nav-playbook]').forEach(el =>
    el.addEventListener('click', () => selectItem('playbook', el.getAttribute('data-nav-playbook'))));
  prUl.querySelectorAll('[data-nav-project]').forEach(el =>
    el.addEventListener('click', () => selectItem('project', el.getAttribute('data-nav-project'))));
}

function selectItem(type, id) {
  selected = { type, id };
  editing = false;
  render();
}

function renderDetail() {
  const main = document.getElementById('detail');

  // Guard against a stale selection (e.g. a deleted project)
  if (selected.type === 'project' && !data.projects.find(p => p.id === selected.id)) {
    selected = { type: 'playbook', id: 'designing' };
  }

  if (selected.type === 'playbook') renderPlaybookDetail(main);
  else renderProjectDetail(main);
}

function renderPlaybookDetail(main) {
  const def = PLAYBOOK_DEFS.find(d => d.id === selected.id) || PLAYBOOK_DEFS[0];
  const val = data.playbooks[def.id] || '';

  if (editing) {
    main.innerHTML = `
      <div class="detail-head">
        <div class="detail-title-wrap">
          <span class="detail-bar" style="background:${def.color}"></span>
          <div>
            <h1 class="detail-title">${escapeHtml(def.label)}</h1>
            <div class="detail-sub">${escapeHtml(def.sub)}</div>
          </div>
        </div>
      </div>
      <textarea id="pb-text" placeholder="${escapeHtml(def.placeholder)}">${escapeHtml(val)}</textarea>
      ${MD_HINT}
      <div class="edit-row">
        <button class="btn primary" id="pb-save">Save</button>
        <button class="btn" id="pb-cancel">Cancel</button>
      </div>`;
    const ta = document.getElementById('pb-text');
    if (ta) setTimeout(() => ta.focus(), 50);
    document.getElementById('pb-save').addEventListener('click', () => {
      data.playbooks[def.id] = document.getElementById('pb-text').value;
      saveData(data);
      editing = false;
      render();
    });
    document.getElementById('pb-cancel').addEventListener('click', () => { editing = false; render(); });
  } else {
    const has = val && val.trim();
    main.innerHTML = `
      <div class="detail-head">
        <div class="detail-title-wrap">
          <span class="detail-bar" style="background:${def.color}"></span>
          <div>
            <h1 class="detail-title">${escapeHtml(def.label)}</h1>
            <div class="detail-sub">${escapeHtml(def.sub)}</div>
          </div>
        </div>
        <div class="header-actions"><button class="btn" id="pb-edit">Edit</button></div>
      </div>
      ${has
        ? `<div class="notes-display rendered">${renderMarkdown(val)}</div>`
        : `<div class="notes-display empty">Nothing written yet. Click Edit to add this section.</div>`}`;
    document.getElementById('pb-edit').addEventListener('click', () => { editing = true; render(); });
  }
}

function renderProjectDetail(main) {
  const p = data.projects.find(x => x.id === selected.id);
  if (!p) { selected = { type: 'playbook', id: 'designing' }; renderDetail(); return; }

  if (editing) {
    main.innerHTML = `
      <div class="detail-head">
        <div class="detail-title-wrap" style="flex:1;">
          <span class="detail-bar" style="background:var(--accent)"></span>
          <input type="text" id="pr-title" class="detail-title-input" value="${escapeHtml(p.title)}" placeholder="Project name (e.g. Workout App)">
        </div>
        <div class="header-actions"><button class="btn danger" id="pr-delete">Delete</button></div>
      </div>
      <textarea id="pr-text" placeholder="Notes for this project. Markdown supported.">${escapeHtml(p.notes)}</textarea>
      ${MD_HINT}
      <div class="edit-row">
        <button class="btn primary" id="pr-save">Save</button>
        <button class="btn" id="pr-cancel">Cancel</button>
      </div>`;
    setTimeout(() => {
      const t = document.getElementById(p.title ? 'pr-text' : 'pr-title');
      if (t) t.focus();
    }, 50);

    document.getElementById('pr-save').addEventListener('click', () => {
      p.title = (document.getElementById('pr-title').value || '').trim();
      p.notes = document.getElementById('pr-text').value;
      saveData(data);
      editing = false;
      render();
    });
    document.getElementById('pr-cancel').addEventListener('click', () => {
      // Drop a brand-new project that was never filled in
      if (!p.title && !p.notes) {
        data.projects = data.projects.filter(x => x.id !== p.id);
        saveData(data);
        selected = { type: 'playbook', id: 'designing' };
      }
      editing = false;
      render();
    });
    document.getElementById('pr-delete').addEventListener('click', () => {
      const name = p.title ? `"${p.title}"` : 'this project';
      askConfirm(`Delete ${name}?`, 'This cannot be undone.', () => {
        data.projects = data.projects.filter(x => x.id !== p.id);
        saveData(data);
        selected = data.projects.length
          ? { type: 'project', id: data.projects[0].id }
          : { type: 'playbook', id: 'designing' };
        editing = false;
        render();
      });
    });
  } else {
    const has = p.notes && p.notes.trim();
    main.innerHTML = `
      <div class="detail-head">
        <div class="detail-title-wrap">
          <span class="detail-bar" style="background:var(--accent)"></span>
          <div>
            <h1 class="detail-title">${escapeHtml(p.title || 'Untitled Project')}</h1>
            <div class="detail-sub">Project</div>
          </div>
        </div>
        <div class="header-actions"><button class="btn" id="pr-edit">Edit</button></div>
      </div>
      ${has
        ? `<div class="notes-display rendered">${renderMarkdown(p.notes)}</div>`
        : `<div class="notes-display empty">No notes yet. Click Edit to add some.</div>`}`;
    document.getElementById('pr-edit').addEventListener('click', () => { editing = true; render(); });
  }
}

// ===== Actions =====

function addProject() {
  const id = newId('proj');
  data.projects.unshift({ id, title: '', notes: '', createdAt: Date.now() });
  saveData(data);
  selected = { type: 'project', id };
  editing = true;
  render();
}

function askConfirm(title, body, onOk) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent = body || '';
  pendingConfirm = onOk;
  document.getElementById('confirm-modal').classList.add('show');
}
function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('show');
  pendingConfirm = null;
}

function exportJson() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `app-progress-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJson(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (typeof imported !== 'object') throw new Error('Invalid format');
      askConfirm('Replace all data?', 'This will overwrite your current playbooks and projects.', () => {
        if (!imported.playbooks) imported.playbooks = {};
        if (!imported.projects) imported.projects = [];
        for (const def of PLAYBOOK_DEFS) {
          if (imported.playbooks[def.id] === undefined) imported.playbooks[def.id] = '';
        }
        data = imported;
        saveData(data);
        selected = { type: 'playbook', id: 'designing' };
        editing = false;
        render();
      });
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ===== Wiring =====

document.getElementById('add-project-btn').addEventListener('click', addProject);
document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
document.getElementById('confirm-ok').addEventListener('click', () => {
  if (pendingConfirm) pendingConfirm();
  closeConfirm();
});
document.getElementById('export-btn').addEventListener('click', exportJson);
document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', e => {
  if (e.target.files[0]) { importJson(e.target.files[0]); e.target.value = ''; }
});

render();
</script>
</body>
